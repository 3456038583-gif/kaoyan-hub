        <h1>凑微分</h1>
        <div class="note-meta"><span class="tag">#高数</span> <span class="tag">#多元函数微分学及其应用</span> <span class="aliases">别名：凑微分</span></div>
      </header>
      <div class="prose" id="prose"><h2 id="方法">方法</h2><ul>
<li>处理二元函数或隐函数微分问题时，先把表达式整理成 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mtext> </mtext><mi mathvariant="normal">d</mi><mi>x</mi><mo>+</mo><mi>B</mi><mtext> </mtext><mi mathvariant="normal">d</mi><mi>y</mi></mrow><annotation encoding="application/x-tex">A\,\mathrm{d}x+B\,\mathrm{d}y</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7778em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathrm">d</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathrm">d</span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span></span></span></span> 的形式。</li>
<li>再判断它是否可以看作某个函数的全微分，从而反推函数结构。</li>
</ul>
