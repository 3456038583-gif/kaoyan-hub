        <h1>微分形式不变性</h1>
        <div class="note-meta"><span class="tag">#高数</span> <span class="tag">#多元函数微分学及其应用</span> <span class="aliases">别名：微分形式不变性</span></div>
      </header>
      <div class="prose" id="prose"><h2 id="方法">方法</h2><ul>
<li>在隐函数或复合函数问题中，常把关系式先写成微分形式，再按一元函数微分的形式规则进行整理。</li>
<li>核心是：形式保持不变，但变量关系需要结合题设继续消元。</li>
</ul>
